[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomy-boundary"
version = "0.3.0"
description = "Reference implementation of the Autonomy Boundary Framework (ABF): eight controls that make agent autonomy auditable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hooman Parta" }]
keywords = ["agentic-ai", "ai-security", "ai-governance", "guardrails", "audit"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/abf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
